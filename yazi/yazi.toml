# Thêm Chrome vào menu O cho file html; Enter vẫn mở bằng $EDITOR
[opener]
browser = [
	{ run = "google-chrome %s1", desc = "Chrome", for = "linux", orphan = true },
]

[open]
prepend_rules = [
	{ mime = "text/html", use = [ "edit", "browser", "reveal" ] },
]

# Preview file Office (docx/xlsx/pptx...) bằng plugin office.yazi (cần libreoffice + pdftoppm)
[plugin]
prepend_preloaders = [
	{ mime = "application/openxmlformats-officedocument.*", run = "office" },
	{ mime = "application/oasis.opendocument.*", run = "office" },
	{ mime = "application/ms-*", run = "office" },
	{ mime = "application/msword", run = "office" },
	{ url = "*.docx", run = "office" },
]
prepend_previewers = [
	{ mime = "application/openxmlformats-officedocument.*", run = "office" },
	{ mime = "application/oasis.opendocument.*", run = "office" },
	{ mime = "application/ms-*", run = "office" },
	{ mime = "application/msword", run = "office" },
	{ url = "*.docx", run = "office" },
]
